# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2026-10"

[[extensions]]
name = "fab-cod-otp"
handle = "fab-cod-otp"
type = "ui_extension"
uid = "659ed2d7-5bd1-833f-b79f-10cfeaecbe65907cee33"

# Renders right below the payment methods
[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.payment-method-list.render-after"

[extensions.capabilities]
api_access = true
# Needed to call the backend (OTP send/verify)
network_access = true
# Needed to block "Complete order" until the OTP is verified
block_progress = true

# Settings the merchant can change in the checkout editor
[extensions.settings]

  [[extensions.settings.fields]]
  key = "backend_url"
  type = "single_line_text_field"
  name = "App URL"
  description = "Your app URL, e.g. https://your-app.onrender.com (no trailing slash)"

  [[extensions.settings.fields]]
  key = "cod_payment_types"
  type = "single_line_text_field"
  name = "COD payment types (comma separated)"
  description = "Default: paymentOnDelivery,manualPayment"